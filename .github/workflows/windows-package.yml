name: Windows MSVC package validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'studio/**'
      - 'scripts/test-windows-package.ps1'
      - '.github/workflows/windows-package.yml'
  push:
    paths:
      - 'studio/**'
      - 'scripts/test-windows-package.ps1'
      - '.github/workflows/windows-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install locked frontend dependencies
        working-directory: studio
        run: npm ci
      - name: Frontend and native regression gates
        working-directory: studio
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Build production NSIS package with MSVC
        working-directory: studio
        run: npm run desktop:build
      - name: Install, smoke-test and uninstall native package
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-msvc-package-and-evidence
          path: |
            studio/src-tauri/target/release/bundle/nsis/*.exe
            build/windows-evidence/
