name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-v3:
    name: React, Tauri, Rust, and dependency safety
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install stable Rust with required components
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Install locked frontend dependencies
        working-directory: studio
        run: npm ci
      - name: Build and test the frontend
        working-directory: studio
        run: npm run check
      - name: Audit production dependencies
        working-directory: studio
        run: npm audit --audit-level=high
      - name: Enforce Rust formatting
        working-directory: studio/src-tauri
        run: cargo fmt --check
      - name: Enforce warning-free Rust
        working-directory: studio/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Run native unit and regression tests
        working-directory: studio/src-tauri
        run: cargo test

  application:
    name: Python and project intelligence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile Python
        run: python -m compileall -q ide
      - name: Run unit tests
        run: python -m unittest discover -s ide\tests -v
      - name: Check maintained projects
        shell: pwsh
        run: |
          python ide\fpga_ide.py --check projects\_template
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ide\fpga_ide.py --check projects\01_button_led_pwm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ide\fpga_ide.py --check projects\03_uart_terminal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ide\fpga_ide.py --check projects\05_serial_command_console
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ide\fpga_ide.py --check projects\06_hardware_intelligence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Parse PowerShell and JSON
        shell: pwsh
        run: .\scripts\release-check.ps1 -SkipHdl -SkipNative

  hdl:
    name: HDL lint and self-checking simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install open-source HDL checks
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Verilator lint
        working-directory: projects/01_button_led_pwm
        run: >-
          verilator --lint-only --timing -Wall -Wno-DECLFILENAME --top-module top
          rtl/button_debouncer.sv rtl/input_synchronizer.sv
          rtl/led_mode_controller.sv rtl/reset_generator.sv rtl/top.sv
      - name: Self-checking simulation
        working-directory: projects/01_button_led_pwm
        run: |
          mkdir -p build
          iverilog -g2012 -Wall -s tb_top -o build/tb_top.vvp \
            rtl/button_debouncer.sv rtl/input_synchronizer.sv \
            rtl/led_mode_controller.sv rtl/reset_generator.sv rtl/top.sv sim/tb_top.sv
          vvp build/tb_top.vvp
      - name: UART lesson lint and self-checking simulation
        working-directory: projects/03_uart_terminal
        run: |
          mkdir -p build
          verilator --lint-only --timing -Wall -Wno-DECLFILENAME --top-module top \
            rtl/top.sv rtl/uart_rx.sv rtl/uart_tx.sv
          iverilog -g2012 -Wall -s tb_top -o build/tb_top.vvp \
            rtl/top.sv rtl/uart_rx.sv rtl/uart_tx.sv sim/tb_top.sv
          vvp build/tb_top.vvp
      - name: Serial command console lint and self-checking simulation
        working-directory: projects/05_serial_command_console
        run: |
          mkdir -p build
          verilator --lint-only --timing -Wall -Wno-DECLFILENAME --top-module top \
            rtl/top.sv rtl/uart_rx.sv rtl/uart_tx.sv
          iverilog -g2012 -Wall -s tb_top -o build/tb_top.vvp \
            rtl/top.sv rtl/uart_rx.sv rtl/uart_tx.sv sim/tb_top.sv
          vvp build/tb_top.vvp
      - name: Verify packaged project templates
        shell: bash
        run: |
          set -euo pipefail
          for project in spi_controller vga_timing riscv_scaffold console_led_button; do
            echo "Verifying templates/${project}"
            pushd "templates/${project}" >/dev/null
            mkdir -p build
            verilator --lint-only --timing -Wall -Wno-DECLFILENAME --top-module top rtl/*.sv
            iverilog -g2012 -Wall -s tb_top -o build/tb_top.vvp rtl/*.sv sim/tb_top.sv
            vvp build/tb_top.vvp
            popd >/dev/null
          done
      - name: Hardware Intelligence demo lint and simulation
        working-directory: projects/06_hardware_intelligence
        run: |
          mkdir -p build
          verilator --lint-only --timing -Wall -Wno-DECLFILENAME --top-module top rtl/top.sv
          iverilog -g2012 -Wall -s tb_top -o build/tb_top.vvp rtl/top.sv sim/tb_top.sv
          vvp build/tb_top.vvp
