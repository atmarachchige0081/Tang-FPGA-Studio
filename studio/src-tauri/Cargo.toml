[package]
name = "fpga-studio"
version = "3.1.0"
description = "A professional, beginner-friendly FPGA development workspace"
authors = ["FPGA Studio contributors"]
license = "MIT"
repository = "https://github.com/atmarachchige0081/Tang-FPGA-Studio"
edition = "2021"
rust-version = "1.85"

[lib]
name = "fpga_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
serialport = { version = "4.9.0", default-features = false }
tauri = { version = "2.11.5", features = [] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
